<form [formGroup]="form()" (ngSubmit)="handleNgSubmit()">
  @if (formData() !== undefined) {
    <div class="row">
      <div class="col-lg-6">
        <p class="view-label">
          ID
          <span>
            {{ formData().id }}
          </span>
        </p>
      </div>
      <div class="col-lg-6 mt-4 mt-lg-0">
        <p class="view-label">
          Registration date
          <span>
            {{ formData().createdAt | date: 'dd/MM/yyyy HH:mm:ss' }}
          </span>
        </p>
      </div>
    </div>
  }
  <div [class.mt-4]="formData() !== undefined">
    <label
      for="name"
      class="form-label">
      Name
    </label>
    <input
      type="text"
      id="name"
      class="form-control"
      [formControl]="form().controls['name']">
    <control-error
      [control]="form().controls['name']">
    </control-error>
  </div>
  <div class="mt-4">
    <label
      for="email"
      class="form-label">
      Email
    </label>
    <input
      type="email"
      id="email"
      class="form-control"
      [formControl]="form().controls['email']">
    <control-error
      [control]="form().controls['email']">
    </control-error>
  </div>
  @if (passwordFormGroup.enabled === true) {
    <div class="row">
      <div class="col-lg mt-4">
        <div>
          <label
            for="password"
            class="form-label">
            Password
          </label>
          <input
            type="password"
            id="password"
            class="form-control"
            [formControl]="passwordFormGroup.controls['password']">
          <control-error
            [control]="passwordFormGroup.controls['password']">
          </control-error>
        </div>
      </div>
      <div class="col-lg mt-4">
        <div>
          <label
            for="passwordConfirmation"
            class="form-label">
            Password confirmation
          </label>
          <input
            type="password"
            id="passwordConfirmation"
            class="form-control"
            [formControl]="passwordFormGroup.controls['passwordConfirmation']">
          <control-error
            [control]="passwordFormGroup.controls['passwordConfirmation']">
          </control-error>
          @if (passwordFormGroup.errors?.['passwordConfirmation']) {
            <div class="control-error">
              Password and password confirmation do not match.
            </div>
          }
        </div>
      </div>
    </div>
  }
  <div class="mt-4">
    <label
      for="status"
      class="form-label">
      Status
    </label>
    <select
      id="status"
      class="form-control"
      [formControl]="form().controls['status']">
      <option [ngValue]="null">Select an option</option>
      <option [ngValue]="true">Active</option>
      <option [ngValue]="false">Inactive</option>
    </select>
    <control-error
      [control]="form().controls['status']">
    </control-error>
  </div>
  <button
    type="submit"
    class="button mt-4">
    @if (formData() === undefined) {
      Add
    } @else {
      Edit
    }
  </button>
</form>
