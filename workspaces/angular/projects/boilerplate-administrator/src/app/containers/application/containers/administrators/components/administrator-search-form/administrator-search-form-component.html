<form [formGroup]="form()" (ngSubmit)="handleNgSubmit()">
  <div class="row">
    <div class="col-lg">
      <div class="mb-3">
        <label
          for="administratorId"
          class="form-label">
          ID
        </label>
        <input
          type="tel"
          id="administratorId"
          class="form-control"
          [formControl]="form().controls['administratorId']">
      </div>
    </div>
    <div class="col-lg">
      <div class="mb-3">
        <label
          for="administratorName"
          class="form-label">
          Name
        </label>
        <input
          type="text"
          id="administratorName"
          class="form-control"
          [formControl]="form().controls['administratorName']">
      </div>
    </div>
    <div class="col-lg">
      <div class="mb-3">
        <label
          for="administratorEmail"
          class="form-label">
          Email
        </label>
        <input
          type="text"
          id="administratorEmail"
          class="form-control"
          [formControl]="form().controls['administratorEmail']">
      </div>
    </div>
    <div class="col-lg">
      <div class="mb-3">
        <label
          for="administratorStatus"
          class="form-label">
          Status
        </label>
        <select
          id="administratorStatus"
          class="form-control"
          [formControl]="form().controls['administratorStatus']">
          <option [ngValue]="null">
            All
          </option>
          <option [ngValue]="true">
            Active
          </option>
          <option [ngValue]="false">
            Inactive
          </option>
        </select>
      </div>
    </div>
  </div>
</form>
