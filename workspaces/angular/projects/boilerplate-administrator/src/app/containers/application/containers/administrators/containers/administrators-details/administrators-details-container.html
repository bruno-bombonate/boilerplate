<h1>
  {{ activatedRoute.snapshot.title }}
</h1>
@if (administrator() !== undefined) {
  <div class="row">
    <div class="col-lg-6 mt-4">
      <div class="card">
        <app-administrator-signal-form
          [formData]="administrator()"
          [formLoading]="formLoading()"
          (formSubmit)="handleFormSubmit($event)">
        </app-administrator-signal-form>
      </div>
    </div>
  </div>
}
