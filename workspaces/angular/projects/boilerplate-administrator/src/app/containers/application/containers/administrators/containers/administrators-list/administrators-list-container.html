<div class="row align-items-center">
  <div class="col">
    <h1>
      {{ activatedRoute.snapshot.title }}
    </h1>
  </div>
  <div class="col-auto">
    <a
      class="button"
      [routerLink]="'add'">
      Add
    </a>
  </div>
</div>
<app-administrator-search-signal-form
  [formData]="listSearchParams()"
  (formChange)="handleListSearchFormChange($event)">
</app-administrator-search-signal-form>
<div class="card mt-4">
  @if (listLoading() === true) {
    <p class="fw-light text-center">
      Loading...
    </p>
  } @else {
    @if (list().length === 0) {
      <p class="fw-light text-center">
        No administrator found.
      </p>
    } @else {
      <app-administrator-list
        [list]="list()">
      </app-administrator-list>
    }
  }
</div>
