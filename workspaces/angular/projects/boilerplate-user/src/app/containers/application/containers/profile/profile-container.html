<div class="row align-items-center">
  <div class="col">
    <h1>
      {{ activatedRoute.snapshot.title }}
    </h1>
  </div>
  <div class="col-auto">
    <button
      type="button"
      class="button"
      (click)="applicationContainer.handleSignOut()">
      Sign out
    </button>
  </div>
</div>
<div class="card mt-4">
  @if (userService.user !== undefined) {
    <app-profile-view
      [item]="userService.user">
    </app-profile-view>
  }
</div>
<h2 class="mt-4">
  Change password
</h2>
<div class="card mt-4">
  <app-password-form
    [formLoading]="formLoading()"
    [formReset]="formReset"
    (formSubmit)="handleFormSubmit($event)">
  </app-password-form>
</div>
