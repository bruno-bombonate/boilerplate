<div class="row justify-content-center">
  <div class="col-lg-6 mt-4">
    <div class="card">
      <h2>
        {{ activatedRoute.snapshot.title }}
      </h2>
      @if (token() === null) {
        <app-reset-password-request-signal-form
          [formLoading]="formLoading()"
          (formSubmit)="handleResetPasswordRequestFormSubmit($event)">
        </app-reset-password-request-signal-form>
      } @else {
        <app-reset-password-signal-form
          [formLoading]="formLoading()"
          (formSubmit)="handleResetPasswordFormSubmit($event)">
        </app-reset-password-signal-form>
      }
    </div>
    <div class="text-center mt-4">
      <p>
        Remember the password?
        <a [routerLink]="['../', signInContainerRoutes.path]">{{ signInContainerRoutes.title }}</a>.
      </p>
    </div>
  </div>
</div>
