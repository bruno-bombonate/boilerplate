<form [formGroup]="form()" (ngSubmit)="handleNgSubmit()">
  <div class="mt-4">
    <label
      for="name"
      class="form-label">
      Name
    </label>
    <input
      type="text"
      id="name"
      class="form-control"
      [formControl]="form().controls['name']">
    <control-error
      [control]="form().controls['name']">
    </control-error>
  </div>
  <div class="mt-4">
    <label
      for="email"
      class="form-label">
      Email
    </label>
    <input
      type="email"
      id="email"
      class="form-control"
      autocomplete="username"
      [formControl]="form().controls['email']">
    <control-error
      [control]="form().controls['email']">
    </control-error>
  </div>
  @if (passwordFormGroup.enabled === true) {
    <div class="row">
      <div class="col-lg mt-4">
        <div>
          <label
            for="password"
            class="form-label">
            Password
          </label>
          <input
            type="password"
            id="password"
            class="form-control"
            autocomplete="new-password"
            [formControl]="passwordFormGroup.controls['password']">
          <control-error
            [control]="passwordFormGroup.controls['password']">
          </control-error>
        </div>
      </div>
      <div class="col-lg mt-4">
        <div>
          <label
            for="passwordConfirmation"
            class="form-label">
            Password confirmation
          </label>
          <input
            type="password"
            id="passwordConfirmation"
            class="form-control"
            autocomplete="new-password"
            [formControl]="passwordFormGroup.controls['passwordConfirmation']">
          <control-error
            [control]="passwordFormGroup.controls['passwordConfirmation']">
          </control-error>
          @if (passwordFormGroup.errors?.['passwordConfirmation']) {
            <div class="control-error">
              Password and password confirmation do not match.
            </div>
          }
        </div>
      </div>
    </div>
  }
  <div class="text-center mt-4">
    <button
      type="submit"
      class="button"
      [disabled]="formLoading() === true">
      Sign up
    </button>
  </div>
</form>
