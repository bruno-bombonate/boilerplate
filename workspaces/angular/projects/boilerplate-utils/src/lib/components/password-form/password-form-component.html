<form [formGroup]="form()" (ngSubmit)="handleNgSubmit()">
  <div>
    <label
      for="passwordCurrent"
      class="form-label">
      Current password
    </label>
    <input
      type="password"
      id="passwordCurrent"
      class="form-control"
      autocomplete="current-password"
      formControlName="passwordCurrent">
    <control-error
      [control]="form().controls['passwordCurrent']">
    </control-error>
  </div>
  <div class="row">
    <div class="col-lg mt-4">
      <div>
        <label
          for="passwordNew"
          class="form-label">
          New password
        </label>
        <input
          type="password"
          id="passwordNew"
          class="form-control"
          autocomplete="new-password"
          formControlName="passwordNew">
        <control-error
          [control]="form().controls['passwordNew']">
        </control-error>
      </div>
    </div>
    <div class="col-lg mt-4">
      <div>
        <label
          for="passwordNewConfirmation"
          class="form-label">
          New password confirmation
        </label>
        <input
          type="password"
          id="passwordNewConfirmation"
          class="form-control"
          autocomplete="new-password"
          formControlName="passwordNewConfirmation">
        <control-error
          [control]="form().controls['passwordNewConfirmation']">
        </control-error>
        @if (form().errors?.['passwordConfirmation']) {
          <div class="control-error">
            New password and new password confirmation do not match.
          </div>
        }
      </div>
    </div>
  </div>
  <button
    type="submit"
    class="button mt-4">
    Change
  </button>
</form>
