<form [formGroup]="form()" (ngSubmit)="handleNgSubmit()">
  <div class="mt-4">
    <label
      for="password"
      class="form-label">
      Password
    </label>
    <input
      type="password"
      id="password"
      class="form-control"
      autocomplete="new-password"
      [formControl]="form().controls['password']">
    <control-error
      [control]="form().controls['password']">
    </control-error>
  </div>
  <div class="mt-4">
    <label
      for="passwordConfirmation"
      class="form-label">
      Password confirmation
    </label>
    <input
      type="password"
      id="passwordConfirmation"
      class="form-control"
      autocomplete="new-password"
      [formControl]="form().controls['passwordConfirmation']">
    <control-error
      [control]="form().controls['passwordConfirmation']">
    </control-error>
    @if (form().errors?.['passwordConfirmation']) {
      <div class="control-error">
        Password and password confirmation do not match.
      </div>
    }
  </div>
  <div class="text-center mt-4">
    <button
      type="submit"
      class="button"
      [disabled]="formLoading() === true">
      Reset password
    </button>
  </div>
</form>
