<form [formGroup]="form()" (ngSubmit)="handleNgSubmit()">
  <div class="mt-4">
    <label
      for="email"
      class="form-label">
      Email
    </label>
    <input
      type="email"
      id="email"
      class="form-control"
      autocomplete="username"
      [formControl]="form().controls['email']">
    <control-error
      [control]="form().controls['email']">
    </control-error>
  </div>
  <div class="text-center mt-4">
    <button
      type="submit"
      class="button"
      [disabled]="formLoading() === true">
      Reset password
    </button>
  </div>
</form>
