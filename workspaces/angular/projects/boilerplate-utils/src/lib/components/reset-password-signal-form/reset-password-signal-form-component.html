<form [formRoot]="form" (submit)="handleSubmit()">
  <div class="mt-4">
    <label
      for="password"
      class="form-label">
      Password
    </label>
    <input
      type="password"
      id="password"
      class="form-control"
      autocomplete="new-password"
      [formField]="form.password">
    <control-error
      [control]="form.password">
    </control-error>
  </div>
  <div class="mt-4">
    <label
      for="passwordConfirmation"
      class="form-label">
      Password confirmation
    </label>
    <input
      type="password"
      id="passwordConfirmation"
      class="form-control"
      autocomplete="new-password"
      [formField]="form.passwordConfirmation">
    <control-error
      [control]="form.passwordConfirmation">
    </control-error>
    @if (hasPasswordConfirmationError()) {
      <div class="control-error">
        Password and password confirmation do not match.
      </div>
    }
  </div>
  <div class="text-center mt-4">
    <button
      type="submit"
      class="button"
      [disabled]="formLoading() === true">
      Reset password
    </button>
  </div>
</form>
