<form [formGroup]="form()" (ngSubmit)="handleNgSubmit()">
  <div class="mb-3">
    <label
      for="password"
      class="form-label">
      Password
    </label>
    <input
      type="password"
      id="password"
      class="form-control"
      autocomplete="new-password"
      [formControl]="form().controls['password']">
    @if (controlErrorMessageIsVisible(form().controls['password'])) {
      <control-error
        [controlErrors]="form().controls['password'].errors">
      </control-error>
    }
  </div>
  <div class="mb-3">
    <label
      for="passwordConfirmation"
      class="form-label">
      Password confirmation
    </label>
    <input
      type="password"
      id="passwordConfirmation"
      class="form-control"
      autocomplete="new-password"
      [formControl]="form().controls['passwordConfirmation']">
    @if (controlErrorMessageIsVisible(form().controls['passwordConfirmation'])) {
      <control-error
        [controlErrors]="form().controls['passwordConfirmation'].errors">
      </control-error>
    }
    @if (form().errors?.['passwordConfirmation']) {
      <div class="control-error">
        Password and password confirmation do not match.
      </div>
    }
  </div>
  <div class="text-center">
    <button
      type="submit"
      class="button"
      [disabled]="formLoading() === true">
      Reset password
    </button>
  </div>
</form>
